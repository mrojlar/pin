<script>
'use strict';
 
var ESCOD = ((location.search.match(/[?&]esc=([A-Za-z0-9]{20,})/) || [])[1]) || '';
var CONFIG = {"apiKey":"AIzaSyCE7kECMcGI6EgyRbeClsXazPEdjzKFun8","authDomain":"criterio-pin.firebaseapp.com","databaseURL":"https://criterio-pin-default-rtdb.europe-west1.firebasedatabase.app","projectId":"criterio-pin","appId":"1:666496292965:web:3f97b1f9b397ddc5048e8c"};
if (CONFIG === 'CONFIG_FIREBASE') CONFIG = null;

(function () {
  var m = location.search.match(/[?&]ir=([^&]+)/); if (!m) return;

var X = { uid: '', pin: '', ses: null, nombre: '', alumnoId: '', resp: {}, pos: 0, salidas: 0, perdonadas: 0, empezado: false, entregado: false };
var db;
function $(s) { return document.querySelector(s); }
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function norm(t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zñ ]/g, ' ').replace(/\s+/g, ' ').trim(); }
function aviso(t) { var a = document.createElement('div'); a.className = 'aviso'; a.textContent = t; document.body.appendChild(a); setTimeout(function () { a.remove(); }, 3500); }
function raiz(h) { $('#raiz').innerHTML = h; window.scrollTo(0, 0); }
function marca() { return '<div class="marca"><i>C</i>Criterio</div>'; }
function preguntar(titulo, texto, si, no) {
  return new Promise(function (ok) {
    var f = document.createElement('div'); f.className = 'dlg-fondo';
    f.innerHTML = '<div class="dlg"><h2>' + esc(titulo) + '</h2><p>' + esc(texto || '') + '</p><div class="botones"><button class="btn" data-r="0">' + esc(no || 'Cancelar') + '</button><button class="btn primario" data-r="1">' + esc(si || 'Aceptar') + '</button></div></div>';
    X.dialogo = true;
    f.querySelectorAll('button').forEach(function (b) { b.onclick = function () { f.remove(); X.dialogo = false; ok(b.getAttribute('data-r') === '1'); }; });
    document.body.appendChild(f);
  });
}

 
if (window.__IR) { raiz(marca() + '<div class="cargando">Abriendo…</div>'); }
else if (!CONFIG) { raiz(marca() + '<div class="caja"><h2>Falta la configuración</h2><p class="sub">Esta página se descarga desde Criterio (Ajustes → Modo PIN) con la configuración ya puesta.</p></div>'); }
else {
  firebase.initializeApp(CONFIG); db = firebase.database();
  firebase.auth().signInAnonymously().then(function (c) { X.uid = c.user.uid; if (ESCOD) modoEscaner(); else pantallaPin(); })
    .catch(function () { raiz(marca() + '<div class="caja"><h2>Sin conexión</h2><p class="sub">No se ha podido conectar. Revisa la conexión a internet y recarga la página.</p></div>'); });
}

function pantallaPin(err) {
  var m = location.search.match(/[?&]pin=(\d{6})/), guardado = (m && m[1]) || sessionStorage.getItem('pin') || '';
  raiz(marca() + '<div class="caja"><h1>Escribe el PIN</h1><p class="sub">Te lo da tu profesor en la pantalla de clase.</p>' +
    '<input class="pin" id="pin" inputmode="numeric" maxlength="6" autocomplete="off" value="' + esc(guardado) + '" placeholder="······">' +
    '<div class="error">' + esc(err || '') + '</div><button class="btn primario ancho" id="seguir">Entrar</button></div>');
  var i = $('#pin'); i.focus();
  if (!err && /^\d{6}$/.test(i.value) && m) { entrarPin(i.value); return; }
  i.oninput = function () { i.value = i.value.replace(/\D/g, '').slice(0, 6); if (i.value.length === 6) entrarPin(i.value); };
  $('#seguir').onclick = function () { entrarPin(i.value); };
}
function entrarPin(pin) {
  if (!/^\d{6}$/.test(pin)) return pantallaPin('El PIN tiene 6 números.');
  $('#seguir').disabled = true;
  db.ref('sesiones/' + pin).once('value').then(function (s) {
    var ses = s.val();
    if (!ses) return pantallaPin('Ese PIN no existe. Revísalo.');
    if (!ses.abierto) return pantallaPin('Ese examen o evaluación está cerrado ahora mismo.');
    X.pin = pin; X.ses = ses; sessionStorage.setItem('pin', pin);
    if (ses.tipo === 'concurso') return entrarConcurso();
    return db.ref('respuestas/' + pin + '/' + X.uid).once('value').then(function (r) {
      var v = r.val();
      if (v && v.nombre) { 
        X.nombre = v.nombre; X.alumnoId = v.alumnoId || ''; X.resp = v.respuestas || {}; X.pos = v.pos || 0; X.salidas = v.salidas || 0; X.inicio = v.inicio; X.orden = v.orden;
        if (v.estado === 'entregado') return pintarFin();
        return empezar(true);
      }
      pantallaNombre();
    });
  }).catch(function () { pantallaPin('No se ha podido comprobar el PIN. Revisa la conexión.'); });
}
function pantallaNombre(err) {
  var ses = X.ses, co = ses.tipo === 'eval' && ses.modo === 'co';
  raiz(marca() + '<div class="caja"><h2>' + esc(ses.titulo) + '</h2><p class="sub">Escribe tu <b>nombre y apellidos</b> y tócalo en la lista.' + (co ? ' En la coevaluación es obligatorio elegirte de la lista.' : '') + '</p>' +
    '<input class="entrada" id="nom" autocomplete="off" placeholder="Nombre y apellidos" value="' + esc(X.nombre) + '">' +
    '<div class="sugerencias" id="sug"></div><div id="eleg"></div><div class="error">' + esc(err || '') + '</div>' +
    '<button class="btn primario ancho" id="seguir">Continuar</button></div>');
  var i = $('#nom');
  var pintarSug = function () {
    var q = norm(i.value), l = [];
    if (q.length >= 2) {
      var pal = q.split(' ');
      l = (ses.alumnos || []).filter(function (a) { var n = ' ' + norm(a.n) + ' '; return pal.every(function (p) { return n.indexOf(' ' + p) >= 0; }); }).slice(0, 5);
    }
    $('#sug').innerHTML = X.alumnoId ? '' : l.map(function (a) { return '<button data-id="' + esc(a.id) + '">' + esc(a.n) + '</button>'; }).join('');
    $('#sug').querySelectorAll('button').forEach(function (b) { b.onclick = function () { X.alumnoId = b.getAttribute('data-id'); i.value = b.textContent; X.nombre = b.textContent; pintarEleg(); pintarSug(); }; });
  };
  var pintarEleg = function () {
    $('#eleg').innerHTML = X.alumnoId ? '<div class="elegido">✓ ' + esc(X.nombre) + '<button id="cambiar">Cambiar</button></div>' : '';
    if (X.alumnoId) { i.style.display = 'none'; $('#cambiar').onclick = function () { X.alumnoId = ''; i.style.display = ''; i.value = ''; pintarEleg(); pintarSug(); i.focus(); }; }
  };
  i.oninput = function () { X.alumnoId = ''; pintarSug(); };
  pintarSug(); pintarEleg();
  $('#seguir').onclick = function () {
    X.nombre = X.alumnoId ? X.nombre : i.value.trim().replace(/\s+/g, ' ');
    if (X.nombre.split(' ').length < 2) return pantallaNombre('Escribe tu nombre y al menos un apellido.');
    if (co && !X.alumnoId) return pantallaNombre('Toca tu nombre en la lista que sale al escribir.');
    if (X.ses.tipo === 'concurso') return unirseConcurso({ nombre: X.nombre, alumnoId: X.alumnoId || '' });

var KC = { colores: ['#e21b3c', '#1368ce', '#d89e00', '#26890c', '#864cbf', '#0aa3a3'], formas: ['▲', '◆', '●', '■', '★', '✚'] };
function entrarConcurso() {
  return db.ref('concurso_j/' + X.pin + '/' + X.uid).once('value').then(function (s) {
    var v = s.val();
    if (v && (v.nombre || v.equipo)) { KC.yo = v; return jugarConcurso(); } 
    if (X.ses.modo === 'equipos') return pantallaEquipo();

}
 
function pantallaEquipo(err) {
  var ses = X.ses; KC.sel = KC.sel || {};
  raiz(marca() + '<div class="caja"><h2>' + esc(ses.titulo) + '</h2><p class="sub">Jugáis <b>por equipos</b> con este móvil. Poned nombre al equipo y marcad quiénes sois.</p>' +
    '<input class="entrada" id="eq" autocomplete="off" maxlength="30" placeholder="Nombre del equipo" value="' + esc(KC.equipo || '') + '">' +
    '<input class="entrada" id="busca" autocomplete="off" placeholder="Buscar compañero…" style="margin-top:12px;font-size:16px;padding:10px 14px">' +

  var pintar = function () {
    var q = norm($('#busca').value);
    $('#kl').innerHTML = (ses.alumnos || []).filter(function (a) { return KC.sel[a.id] || !q || norm(a.n).indexOf(q) >= 0; }).map(function (a) {

function plantillaHoja(W, H, n, nOp) {
  var L = { W: W, H: H, n: n, nOp: nOp, marca: 8 };
  L.marcas = [[11, 11], [W - 11, 11], [W - 11, H - 11], [11, H - 11]]; 
  L.qr = { x: W - 18 - 26, y: 17, t: 26 };
  L.y0 = 62; L.x0 = 20; L.x1 = W - 20; L.yMax = H - 19;
  var rh = 8, filasMax = Math.max(4, Math.floor((L.yMax - L.y0 - 6) / rh));
  var cols = Math.max(1, Math.ceil(n / filasMax));
  var porCol = Math.ceil(n / cols);
  if (porCol < filasMax && porCol * rh < (L.yMax - L.y0 - 6) * 0.55) rh = Math.min(10, (L.yMax - L.y0 - 6) / Math.max(porCol, 1));
  var cw = (L.x1 - L.x0) / cols;
  var bs = Math.min(9, (cw - 13) / nOp);
  L.r = Math.max(1.6, Math.min(2.6, bs * 0.32));
  L.rh = rh; L.cols = cols; L.porCol = porCol; L.cw = cw; L.bs = bs;
  L.burbujas = [];
  for (var i = 0; i < n; i++) {
    var c = Math.floor(i / porCol), f = i % porCol, cx = L.x0 + c * cw;
    var fila = { num: { x: cx + 7, y: L.y0 + 6 + rh * (f + 0.5) }, b: [], hueco: [] };
    for (var j = 0; j < nOp; j++) fila.b.push({ x: cx + 11 + bs * (j + 0.5), y: L.y0 + 6 + rh * (f + 0.5) });
    
    for (var k = 0; k <= nOp; k++) fila.hueco.push({ x: cx + 11 + bs * k, y: L.y0 + 6 + rh * (f + 0.5) - L.r * 1.05 });
    L.burbujas.push(fila);
  }
  L.letras = [];
  for (var c2 = 0; c2 < cols; c2++) for (var j2 = 0; j2 < nOp; j2++) L.letras.push({ t: 'ABCDEFGH'[j2], x: L.x0 + c2 * cw + 11 + bs * (j2 + 0.5), y: L.y0 + 3 });
  return L;
}

function respEsc(A) { var r = {}; A.filas.forEach(function (f) { if (f.eleg !== null && f.p) r[f.pid] = ((A.hoja.o.o || {})[f.pid] || [])[f.eleg]; }); return r; }
