<!DOCTYPE html>

<style>
  :root { --acento: #0071e3; --acento-suave: #e8f2fd; --texto: #1d1d1f; --texto-2: #6e6e73; --linea: #e5e5ea; --fondo: #f5f5f7; --exito: #1f9d4c; --peligro: #d70015; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--fondo); color: var(--texto); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; border: 0; cursor: pointer; }
  .pg { max-width: 640px; margin: 0 auto; padding: 24px 18px 120px; }
  .marca { display: flex; align-items: center; gap: 10px; justify-content: center; margin: 18px 0 26px; font-weight: 700; font-size: 20px; }

  .caja { background: #fff; border-radius: 18px; padding: 22px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }

  .sub { color: var(--texto-2); margin: 0 0 18px; line-height: 1.45; }

  .pin:focus, .entrada:focus { border-color: var(--acento); }
  .entrada { width: 100%; font-size: 18px; padding: 14px 16px; border: 2px solid var(--linea); border-radius: 14px; outline: none; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 20px; border-radius: 14px; font-weight: 600; font-size: 17px; background: #e9e9ee; color: var(--texto); }
  .btn.primario { background: var(--acento); color: #fff; } .btn.ancho { width: 100%; margin-top: 16px; } .btn:disabled { opacity: .45; }
  .error { color: var(--peligro); font-weight: 600; margin-top: 12px; min-height: 1.2em; }
  .sugerencias { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .sugerencias button { text-align: left; background: var(--acento-suave); color: var(--acento); padding: 12px 14px; border-radius: 12px; font-weight: 600; }
  .elegido { margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: #effaf2; color: var(--exito); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .elegido button { background: none; color: var(--texto-2); font-weight: 500; }
  .reglas { margin: 16px 0 0; padding-left: 20px; color: var(--texto-2); line-height: 1.6; }
  .preg { background: #fff; border-radius: 18px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .preg-t { font-weight: 650; font-size: 18px; line-height: 1.4; margin-bottom: 12px; }

  .op { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; margin-top: 8px; border: 2px solid var(--linea); border-radius: 14px; background: #fff; font-size: 16.5px; }
  .op b { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #c7c7cc; display: grid; place-items: center; flex-shrink: 0; color: var(--texto-2); font-size: 14px; }
  .op.sel { border-color: var(--acento); background: var(--acento-suave); } .op.sel b { background: var(--acento); border-color: var(--acento); color: #fff; }
  .barra { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.96); border-top: 1px solid var(--linea); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 12px; }
  .barra .reloj { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 64px; }
  .progreso { flex: 1; height: 8px; border-radius: 4px; background: var(--linea); overflow: hidden; } .progreso span { display: block; height: 100%; background: var(--acento); }
  .paso { color: var(--texto-2); font-weight: 600; margin-bottom: 8px; }
  .velo { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; color: #fff; background: rgba(215,0,21,.95); }
  .velo.bloqueo { background: rgba(28,28,30,.96); } .velo h2 { font-size: 26px; } .velo p { line-height: 1.5; max-width: 420px; }
  .velo .grande { font-size: 56px; }
  .dlg-fondo { position: fixed; inset: 0; background: rgba(0,0,0,.38); z-index: 60; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .dlg { background: #fff; border-radius: 18px; max-width: 380px; width: 100%; padding: 22px 20px 16px; text-align: center; }
  .dlg p { color: var(--texto-2); line-height: 1.45; } .dlg .botones { display: flex; gap: 10px; } .dlg .botones .btn { flex: 1; }
  .fin { text-align: center; padding-top: 40px; } .fin .grande { font-size: 64px; } .nota { font-size: 56px; font-weight: 800; color: var(--acento); margin: 10px 0; }
  .ind { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .ind-t { font-weight: 650; margin-bottom: 10px; line-height: 1.35; }
  .nivel { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-top: 6px; border: 2px solid var(--linea); border-radius: 12px; background: #fff; line-height: 1.35; }
  .nivel small { display: block; color: var(--texto-2); font-weight: 400; margin-top: 2px; }
  .nivel.sel { border-color: var(--acento); background: var(--acento-suave); }
  .evaluado { font-size: 18px; margin: 22px 0 10px; }
  .aviso { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #1d1d1f; color: #fff; padding: 12px 18px; border-radius: 14px; z-index: 70; max-width: 90%; text-align: center; }
  .cargando { text-align: center; color: var(--texto-2); padding: 60px 0; }
</style>

<script>
'use strict';
 
var CONFIG ={
 "storageBucket": "criterio-pin.firebasestorage.app",
 "apiKey": "AIzaSyCE7kECMcGI6EgyRbeClsXazPEdjzKFun8",
 "messagingSenderId": "666496292965",
 "appId": "1:666496292965:web:3f97b1f9b397ddc5048e8c",
 "projectId": "criterio-pin",
 "databaseURL": "https://criterio-pin-default-rtdb.europe-west1.firebasedatabase.app",
 "authDomain": "criterio-pin.firebaseapp.com"
};
var X = { uid: '', pin: '', ses: null, nombre: '', alumnoId: '', resp: {}, pos: 0, salidas: 0, perdonadas: 0, empezado: false, entregado: false };
var db;
function $(s) { return document.querySelector(s); }
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function norm(t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zñ ]/g, ' ').replace(/\s+/g, ' ').trim(); }
function aviso(t) { var a = document.createElement('div'); a.className = 'aviso'; a.textContent = t; document.body.appendChild(a); setTimeout(function () { a.remove(); }, 3500); }
function raiz(h) { $('#raiz').innerHTML = h; window.scrollTo(0, 0); }
function marca() { return '<div class="marca"><i>C</i>Criterio</div>'; }
function preguntar(titulo, texto, si, no) {
  return new Promise(function (ok) {
    var f = document.createElement('div'); f.className = 'dlg-fondo';
    f.innerHTML = '<div class="dlg"><h2>' + esc(titulo) + '</h2><p>' + esc(texto || '') + '</p><div class="botones"><button class="btn" data-r="0">' + esc(no || 'Cancelar') + '</button><button class="btn primario" data-r="1">' + esc(si || 'Aceptar') + '</button></div></div>';
    X.dialogo = true;
    f.querySelectorAll('button').forEach(function (b) { b.onclick = function () { f.remove(); X.dialogo = false; ok(b.getAttribute('data-r') === '1'); }; });
    document.body.appendChild(f);
  });
}

 
if (!CONFIG) { raiz(marca() + '<div class="caja"><h2>Falta la configuración</h2><p class="sub">Esta página se descarga desde Criterio (Ajustes → Modo PIN) con la configuración ya puesta.</p></div>'); }
else {
  firebase.initializeApp(CONFIG); db = firebase.database();
  firebase.auth().signInAnonymously().then(function (c) { X.uid = c.user.uid; pantallaPin(); })
    .catch(function () { raiz(marca() + '<div class="caja"><h2>Sin conexión</h2><p class="sub">No se ha podido conectar. Revisa la conexión a internet y recarga la página.</p></div>'); });
}

function pantallaPin(err) {
  var m = location.search.match(/[?&]pin=(\d{6})/), guardado = (m && m[1]) || sessionStorage.getItem('pin') || '';
  raiz(marca() + '<div class="caja"><h1>Escribe el PIN</h1><p class="sub">Te lo da tu profesor en la pantalla de clase.</p>' +
    '<input class="pin" id="pin" inputmode="numeric" maxlength="6" autocomplete="off" value="' + esc(guardado) + '" placeholder="······">' +
    '<div class="error">' + esc(err || '') + '</div><button class="btn primario ancho" id="seguir">Entrar</button></div>');
  var i = $('#pin'); i.focus();
  if (!err && /^\d{6}$/.test(i.value) && m) { entrarPin(i.value); return; }
  i.oninput = function () { i.value = i.value.replace(/\D/g, '').slice(0, 6); if (i.value.length === 6) entrarPin(i.value); };
  $('#seguir').onclick = function () { entrarPin(i.value); };
}
function entrarPin(pin) {
  if (!/^\d{6}$/.test(pin)) return pantallaPin('El PIN tiene 6 números.');
  $('#seguir').disabled = true;
  db.ref('sesiones/' + pin).once('value').then(function (s) {
    var ses = s.val();
    if (!ses) return pantallaPin('Ese PIN no existe. Revísalo.');
    if (!ses.abierto) return pantallaPin('Ese examen o evaluación está cerrado ahora mismo.');
    X.pin = pin; X.ses = ses; sessionStorage.setItem('pin', pin);
    return db.ref('respuestas/' + pin + '/' + X.uid).once('value').then(function (r) {
      var v = r.val();
      if (v && v.nombre) { 
        X.nombre = v.nombre; X.alumnoId = v.alumnoId || ''; X.resp = v.respuestas || {}; X.pos = v.pos || 0; X.salidas = v.salidas || 0; X.inicio = v.inicio; X.orden = v.orden;
        if (v.estado === 'entregado') return pintarFin();
        return empezar(true);
      }
      pantallaNombre();
    });
  }).catch(function () { pantallaPin('No se ha podido comprobar el PIN. Revisa la conexión.'); });
}
function pantallaNombre(err) {
  var ses = X.ses, co = ses.tipo === 'eval' && ses.modo === 'co';
  raiz(marca() + '<div class="caja"><h2>' + esc(ses.titulo) + '</h2><p class="sub">Escribe tu <b>nombre y apellidos</b> y tócalo en la lista.' + (co ? ' En la coevaluación es obligatorio elegirte de la lista.' : '') + '</p>' +
    '<input class="entrada" id="nom" autocomplete="off" placeholder="Nombre y apellidos" value="' + esc(X.nombre) + '">' +
    '<div class="sugerencias" id="sug"></div><div id="eleg"></div><div class="error">' + esc(err || '') + '</div>' +
    '<button class="btn primario ancho" id="seguir">Continuar</button></div>');
  var i = $('#nom');
  var pintarSug = function () {
    var q = norm(i.value), l = [];
    if (q.length >= 2) {
      var pal = q.split(' ');
      l = (ses.alumnos || []).filter(function (a) { var n = ' ' + norm(a.n) + ' '; return pal.every(function (p) { return n.indexOf(' ' + p) >= 0; }); }).slice(0, 5);
    }
    $('#sug').innerHTML = X.alumnoId ? '' : l.map(function (a) { return '<button data-id="' + esc(a.id) + '">' + esc(a.n) + '</button>'; }).join('');
    $('#sug').querySelectorAll('button').forEach(function (b) { b.onclick = function () { X.alumnoId = b.getAttribute('data-id'); i.value = b.textContent; X.nombre = b.textContent; pintarEleg(); pintarSug(); }; });
  };
  var pintarEleg = function () {
    $('#eleg').innerHTML = X.alumnoId ? '<div class="elegido">✓ ' + esc(X.nombre) + '<button id="cambiar">Cambiar</button></div>' : '';
    if (X.alumnoId) { i.style.display = 'none'; $('#cambiar').onclick = function () { X.alumnoId = ''; i.style.display = ''; i.value = ''; pintarEleg(); pintarSug(); i.focus(); }; }
  };
  i.oninput = function () { X.alumnoId = ''; pintarSug(); };
  pintarSug(); pintarEleg();
  $('#seguir').onclick = function () {
    X.nombre = X.alumnoId ? X.nombre : i.value.trim().replace(/\s+/g, ' ');
    if (X.nombre.split(' ').length < 2) return pantallaNombre('Escribe tu nombre y al menos un apellido.');
    if (co && !X.alumnoId) return pantallaNombre('Toca tu nombre en la lista que sale al escribir.');
    portada();
  };
}

 
function semilla() { var s = 0, t = X.uid + X.pin; for (var k = 0; k < t.length; k++) s = (s * 31 + t.charCodeAt(k)) % 233280; return s || 7; }
function barajar(n, s) { var a = []; for (var i = 0; i < n; i++) a.push(i); for (var j = n - 1; j > 0; j--) { s = (s * 9301 + 49297) % 233280; var k = Math.floor(s / 233280 * (j + 1)); var t = a[j]; a[j] = a[k]; a[k] = t; } return a; }
function prepararOrden() {
  if (X.orden) return;
  var ps = X.ses.preguntas || [], op = X.ses.opciones || {}, s = semilla();
  var p = op.aleatorioP ? barajar(ps.length, s) : ps.map(function (x, i) { return i; }), o = {};
  ps.forEach(function (q, i) { o[q.id] = op.aleatorioR ? barajar(q.o.length, s + i * 17 + 3) : q.o.map(function (x, k) { return k; }); });
  X.orden = { p: p, o: o };
}
function portada() {
  var ses = X.ses;
  if (ses.tipo === 'eval') return empezar();
  var op = ses.opciones || {}, t = op.tiempo || {};
  var reglas = ['Tienes ' + ses.preguntas.length + ' preguntas.', t.modo === 'total' ? 'Tiempo: ' + t.min + ' minutos en total.' : t.modo === 'pregunta' ? t.seg + ' segundos por pregunta.' : 'Sin límite de tiempo.',
    op.atras === false ? 'Una pregunta cada vez: no podrás volver atrás.' : 'Puedes cambiar respuestas hasta entregar.',
    'No salgas de esta pantalla ni abras otras aplicaciones: tu profesor recibe un aviso' + (op.bloquear ? ' y el examen se bloquea.' : '.')];
  raiz(marca() + '<div class="caja"><h2>' + esc(ses.titulo) + '</h2><p class="sub">' + esc(X.nombre) + '</p><ul class="reglas">' + reglas.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>' +
    '<button class="btn primario ancho" id="empezar">Empezar</button></div>');
  $('#empezar').onclick = function () { empezar(); };
}
function empezar(vuelve) {
  X.empezado = true;
  if (!X.inicio) X.inicio = new Date().toISOString();
  if (X.ses.tipo === 'eval') { guardar({}); return pintarEval(); }
  prepararOrden();
  pedirPantallaCompleta();
  guardar({});
  escucharControl();
  pintarExamen();
  if (vuelve) aviso('Sigues donde lo dejaste');
}
function preguntasOrdenadas() { return X.orden.p.map(function (i) { return X.ses.preguntas[i]; }); }
function unoAUno() { var op = X.ses.opciones || {}; return op.atras === false || (op.tiempo && op.tiempo.modo === 'pregunta'); }
function pintarExamen() {
  var ps = preguntasOrdenadas(), uno = unoAUno();
  var tarjeta = function (p, n) {
    return '<div class="preg"><div class="preg-t">' + (n + 1) + '. ' + esc(p.t) + '</div>' + (p.img ? '<img src="' + p.img + '" alt="">' : '') +
      X.orden.o[p.id].map(function (k, j) {
        return '<button class="op' + (X.resp[p.id] === k ? ' sel' : '') + '" data-p="' + esc(p.id) + '" data-k="' + k + '"><b>' + 'abcdefgh'[j] + '</b>' + esc(p.o[k]) + '</button>';
      }).join('') + '</div>';
  };
  var h = '<h2 style="margin:6px 0 14px">' + esc(X.ses.titulo) + '</h2>';
  if (uno) { var p = ps[X.pos]; h += '<div class="paso">Pregunta ' + (X.pos + 1) + ' de ' + ps.length + '</div>' + tarjeta(p, X.pos) + '<button class="btn primario ancho" id="sig">' + (X.pos === ps.length - 1 ? 'Entregar' : 'Siguiente') + '</button>'; }
  else h += ps.map(tarjeta).join('');
  raiz(h + '<div class="barra"><span class="reloj" id="reloj"></span><span class="progreso"><span id="prog"></span></span><span id="cont"></span><button class="btn primario" id="entregar">Entregar</button></div>');
  document.querySelectorAll('.op').forEach(function (b) { b.onclick = function () {
    var pid = b.getAttribute('data-p'); X.resp[pid] = Number(b.getAttribute('data-k'));
    b.parentNode.querySelectorAll('.op').forEach(function (x) { x.classList.toggle('sel', x === b); });
    progreso(); guardar({});
  }; });
  if ($('#sig')) $('#sig').onclick = function () { siguiente(false); };
  $('#entregar').onclick = function () { entregar(false); };
  progreso(); reloj();
}
function progreso() {
  var n = X.ses.preguntas.length, c = Object.keys(X.resp).length;
  if ($('#prog')) $('#prog').style.width = Math.round(c / n * 100) + '%';
  if ($('#cont')) $('#cont').textContent = c + '/' + n;
}
function siguiente(porTiempo) {
  var ps = preguntasOrdenadas(), p = ps[X.pos];
  if (!porTiempo && X.resp[p.id] === undefined && !X.saltar) {
    preguntar('¿Pasar sin contestar?', 'No podrás volver a esta pregunta.', 'Pasar', 'Contestar').then(function (ok) { if (ok) { X.saltar = true; siguiente(false); X.saltar = false; } });
    return;
  }
  if (X.pos >= ps.length - 1) return entregar(true);
  X.pos++; X.tPos = Date.now(); guardar({}); pintarExamen();
}
function reloj() {
  clearInterval(X.reloj);
  var t = (X.ses.opciones || {}).tiempo || {}, el = $('#reloj');
  if (!t.modo || t.modo === 'no') { if (el) el.textContent = ''; return; }
  X.tPos = X.tPos || Date.now();
  X.reloj = setInterval(function () {
    var quedan = t.modo === 'total' ? new Date(X.inicio).getTime() + t.min * 60000 - Date.now() : X.tPos + t.seg * 1000 - Date.now();
    if (quedan <= 0) { clearInterval(X.reloj); if (t.modo === 'total') entregar(true); else siguiente(true); return; }
    var s = Math.ceil(quedan / 1000); if ($('#reloj')) $('#reloj').textContent = '⏱ ' + Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2);
  }, 250);
}
function guardar(extra) {
  if (!X.pin || !X.uid) return Promise.resolve();
  var o = { nombre: X.nombre, alumnoId: X.alumnoId || '', inicio: X.inicio, respuestas: X.resp, pos: X.pos, salidas: X.salidas,
    total: X.ses.tipo === 'examen' ? X.ses.preguntas.length : 0, bloquear: !!(X.ses.opciones && X.ses.opciones.bloquear), estado: 'haciendo', actualizado: new Date().toISOString() };
  if (X.orden) o.orden = X.orden;
  Object.keys(extra || {}).forEach(function (k) { o[k] = extra[k]; });
  return db.ref('respuestas/' + X.pin + '/' + X.uid).set(o).catch(function () { aviso('⚠️ Sin conexión: se guardará al volver la red'); });
}
function entregar(forzado) {
  if (X.entregado) return;
  var faltan = X.ses.tipo === 'examen' ? X.ses.preguntas.length - Object.keys(X.resp).length : 0;
  if (!forzado) {
    preguntar('¿Entregar?', faltan ? (faltan === 1 ? 'Te falta 1 pregunta por contestar.' : 'Te faltan ' + faltan + ' preguntas por contestar.') : 'Ya no podrás cambiar tus respuestas.', 'Entregar', 'Seguir')
      .then(function (ok) { if (ok) entregar(true); });
    return;
  }
  X.entregado = true; X.empezado = false; clearInterval(X.reloj);
  guardar({ estado: 'entregado', fin: new Date().toISOString() }).then(pintarFin);
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
}
function pintarFin() {
  X.empezado = false; X.entregado = true; clearInterval(X.reloj); clearInterval(X.vigila);
  var v = $('.velo'); if (v) v.remove();
  raiz('<div class="fin"><div class="grande">✅</div><h1>' + (X.ses.tipo === 'examen' ? 'Examen entregado' : 'Enviado') + '</h1><p class="sub">' + esc(X.ses.titulo) + ' · ' + esc(X.nombre) + '</p>' +
    '<div id="nota"></div><p class="sub" style="max-width:420px;margin:18px auto 0">Ya has terminado y tus respuestas están guardadas, no te preocupes. 👍<br>Ahora <b>cierra esta pestaña</b> y <b>apaga o guarda el dispositivo</b>.</p></div>');
  
  if (X.ses.tipo === 'examen' && X.ses.opciones && X.ses.opciones.mostrarNota) {
    $('#nota').innerHTML = '<p class="sub">Tu profesor está corrigiendo…</p>';
    db.ref('control/' + X.pin + '/' + X.uid + '/nota').on('value', function (s) {
      var n = s.val(); if (n === null || n === '' || n === undefined) return;
      $('#nota').innerHTML = '<div class="nota">' + String(Math.round(Number(n) * 100) / 100).replace('.', ',') + '</div>';
    });
  }
}

 
function pedirPantallaCompleta() { var d = document.documentElement; if (d.requestFullscreen) d.requestFullscreen().then(function () { X.fsOk = true; }).catch(function () {}); }
function pantallaPartida() { var sw = screen.width, sh = screen.height; return sw && sh && window.innerWidth * window.innerHeight < sw * sh * 0.6; }
var ultima = 0;
function salida() {
  if (!X.empezado || X.ses.tipo !== 'examen' || X.dialogo) return;
  var t = Date.now(); if (t - ultima < 1500) return; ultima = t;
  X.salidas++; guardar({});
  if (X.ses.opciones && X.ses.opciones.bloquear) return mostrarBloqueo();
  if (!$('.velo')) {
    var d = document.createElement('div'); d.className = 'velo';
    d.innerHTML = '<div class="grande">⚠️</div><h2>Has salido del examen</h2><p>Tu profesor ha recibido un aviso.</p><p id="partida" style="display:none;font-weight:700">Cierra la otra aplicación: el examen tiene que ocupar toda la pantalla.</p><button class="btn" style="margin-top:14px">Volver al examen</button>';
    d.querySelector('button').onclick = function () { if (pantallaPartida()) { d.querySelector('#partida').style.display = ''; return; } d.remove(); pedirPantallaCompleta(); };
    document.body.appendChild(d);
  }
}
function mostrarBloqueo() {
  var d = $('.velo'); if (!d) { d = document.createElement('div'); document.body.appendChild(d); }
  d.className = 'velo bloqueo';
  d.innerHTML = '<div class="grande">🔒</div><h2>Examen bloqueado</h2><p>Has salido de la pantalla del examen.<br>Avisa a tu profesor: él decide si puedes seguir.</p><p style="opacity:.7">Tus respuestas están guardadas. Esta pantalla se desbloquea sola.</p>';
}
function escucharControl() {
  if (X.escuchando) return; X.escuchando = true;
  db.ref('control/' + X.pin + '/' + X.uid).on('value', function (s) {
    var c = s.val() || {};
    if (c.entregar && !X.entregado) { X.entregado = true; X.empezado = false; aviso('Tu profesor ha entregado tu examen'); pintarFin(); return; }
    X.perdonadas = Number(c.perdonadas) || 0;
    var bloq = X.ses.opciones && X.ses.opciones.bloquear && X.salidas > X.perdonadas;
    var v = $('.velo.bloqueo');
    if (bloq && !v && X.empezado) mostrarBloqueo();
    if (!bloq && v) { v.remove(); pedirPantallaCompleta(); aviso('🔓 Tu profesor te ha desbloqueado. Puedes seguir.'); }
  });
  db.ref('sesiones/' + X.pin + '/abierto').on('value', function (s) {
    if (s.val() === false && X.empezado && !X.entregado) { X.entregado = true; X.empezado = false; aviso('Tu profesor ha cerrado el examen'); pintarFin(); }
  });
}
document.addEventListener('visibilitychange', function () { if (document.hidden) salida(); });
window.addEventListener('blur', salida);
document.addEventListener('fullscreenchange', function () { if (document.fullscreenElement) X.fsOk = true; else if (X.fsOk && X.empezado) salida(); });
window.addEventListener('resize', function () { if (X.empezado && pantallaPartida()) salida(); });
X.vigila = setInterval(function () { if (X.empezado && !$('.velo') && ((document.hasFocus && !document.hasFocus()) || pantallaPartida())) salida(); }, 1000);

 
function evaluados() {
  var ses = X.ses;
  if (ses.modo !== 'co') return [{ id: X.alumnoId || 'yo', n: 'Tú' }];
  var g = (ses.grupos || []).filter(function (g) { return (g.a || []).indexOf(X.alumnoId) >= 0; })[0];
  if (!g) return [];
  return g.a.filter(function (id) { return id !== X.alumnoId; }).map(function (id) { var a = (ses.alumnos || []).filter(function (x) { return x.id === id; })[0]; return a ? { id: id, n: a.n } : null; }).filter(Boolean);
}
function pintarEval() {
  var ses = X.ses, r = ses.rubrica, ev = evaluados();
  if (!ev.length) return raiz(marca() + '<div class="caja"><h2>No estás en ningún grupo</h2><p class="sub">Avisa a tu profesor.</p></div>');
  var h = '<h2 style="margin:6px 0 4px">' + esc(ses.titulo) + '</h2><p class="sub">' + (ses.modo === 'co' ? 'Valora a cada compañero de tu grupo.' : 'Valórate con sinceridad: elige un nivel en cada apartado.') + '</p>';
  ev.forEach(function (e) {
    if (ses.modo === 'co') h += '<div class="evaluado">👤 ' + esc(e.n) + '</div>';
    var sel = X.resp[e.id] || {};
    r.ind.forEach(function (ind) {
      h += '<div class="ind"><div class="ind-t">' + esc(ind.t) + '</div>' + r.niveles.map(function (n, k) {
        return '<button class="nivel' + (sel[ind.id] === k ? ' sel' : '') + '" data-e="' + esc(e.id) + '" data-i="' + esc(ind.id) + '" data-k="' + k + '"><b>' + esc(n.n) + '</b>' + (ind.d && ind.d[k] ? '<small>' + esc(ind.d[k]) + '</small>' : '') + '</button>';
      }).join('') + '</div>';
    });
  });
  raiz(h + '<button class="btn primario ancho" id="enviar">Enviar</button>');
  document.querySelectorAll('.nivel').forEach(function (b) { b.onclick = function () {
    var e = b.getAttribute('data-e'), i = b.getAttribute('data-i'); X.resp[e] = X.resp[e] || {}; X.resp[e][i] = Number(b.getAttribute('data-k'));
    b.parentNode.querySelectorAll('.nivel').forEach(function (x) { x.classList.toggle('sel', x === b); });
    guardar({});
  }; });
  $('#enviar').onclick = function () {
    var faltan = 0; ev.forEach(function (e) { r.ind.forEach(function (ind) { if (!(X.resp[e.id] && X.resp[e.id][ind.id] !== undefined)) faltan++; }); });
    if (faltan) preguntar('¿Enviar igualmente?', 'Te faltan ' + faltan + ' apartados por valorar.', 'Enviar', 'Seguir').then(function (ok) { if (ok) entregar(true); });
    else entregar(true);
  };
}
</script>
